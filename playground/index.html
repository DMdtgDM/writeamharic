<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ድርኛ — መጫወቻ (Direnya Playground)</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  :root{
    --primary:#1E3A8A; --primary-d:#16296B; --secondary:#F59E0B; --secondary-d:#D6870A;
    --bg:#0F172A; --panel:#111C34; --border:#22335C; --text:#E5EAF8; --muted:#8CA0D0;
    --success:#16A34A; --error:#F87171; --warn-bg:#241726;
  }
  /* ብርሃን ሁነታ — light mode. Toggled via .light-mode on <body>; everything else
     in this file reads colors through the variables above, so this is the
     only place light mode needs to be defined. */
  body.light-mode{
    --bg:#FFFFFF; --panel:#F1F5F9; --border:#E2E8F0; --text:#1E293B; --muted:#64748B;
    --warn-bg:#FEF2F2;
  }
  body.light-mode .cm-tag{color:#0369A1;}
  body.light-mode .cm-attribute{color:#B91C1C;}
  body.light-mode .cm-string{color:#15803D;}
  body.light-mode .cm-number{color:#B45309;}
  body.light-mode .cm-property{color:#0369A1;}
  body.light-mode .cm-atom{color:#B45309;}
  body.light-mode .cm-direnya-keyword{color:#B45309;}
  body.light-mode .cm-direnya-builtin{color:#6D28D9;}
  body.light-mode .cm-comment{color:var(--muted);}
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Noto Sans Ethiopic',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;}
  header{background:var(--panel); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  header h1{font-size:1rem; margin:0; display:flex; align-items:center; gap:8px;}
  header h1 .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;}
  header .spacer{flex:1;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:8px 16px; font-weight:600; font-size:.85rem;}
  .btn-run{background:var(--secondary); color:#fff; padding:4px 7px;}
  .btn-run:hover{background:var(--secondary-d);}
  .btn-dl{background:transparent; color:var(--text); border:1px solid var(--border); padding:4px 6px;}
  .btn-dl:hover{border-color:var(--secondary);}
  .btn-theme{background:transparent; color:var(--text); border:1px solid var(--border); padding:3px 5px;}
  .btn-theme:hover{border-color:var(--secondary);}
  main{flex:1; display:flex; min-height:0;}
  .editor-pane{width:46%; display:flex; flex-direction:column; border-right:1px solid var(--border); min-width:320px;}
  .page-bar{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:4px 10px; background:var(--panel); border-bottom:1px solid var(--border);}
  .page-pill{display:flex; align-items:center; gap:6px; padding:2px 8px; border-radius:8px; font-size:.8rem; font-weight:500; color:var(--muted); background:transparent; border:1px solid var(--border); cursor:pointer;}
  .page-pill.active{color:#fff; background:var(--secondary); border-color:var(--secondary);}
  .page-pill .del-btn{opacity:.7; font-weight:400; padding:0 2px;}
  .page-pill .del-btn:hover{opacity:1;}
  .page-add-btn{padding:2px 8px; border-radius:999px; font-size:.8rem; font-weight:800; color:var(--muted); background:transparent; border:1px dashed var(--border); cursor:pointer;}
  .page-add-btn:hover{color:var(--secondary); border-color:var(--secondary);}
  .tabs{display:flex; background:var(--panel); border-bottom:1px solid var(--border); padding:1px 16px;}
  .tab{padding:6.5px 16px; font-size:.85rem; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer;}
  .tab.active{color:var(--secondary); border-bottom-color:var(--secondary);}
  .tab-content{flex:1; display:none; min-height:0;}
  .tab-content.active{display:flex;}
  textarea{
    flex:1; width:100%; background:var(--bg); color:var(--text); border:none; resize:none;
    font-family:'Fira Code', monospace; font-size:14px; line-height:1.6; padding:14px; outline:none;
  }
  /* CodeMirror: match the playground's own dark theme instead of pulling in a separate theme file */
  .CodeMirror{
    height:100%; background:var(--bg); color:var(--text);
    font-family:'Fira Code', monospace; font-size:14px; line-height:1.6;
  }
  .CodeMirror-gutters{background:var(--panel); border-right:1px solid var(--border);}
  .CodeMirror-linenumber{color:var(--muted); opacity:.6;}
  .CodeMirror-cursor{border-left:1.5px solid var(--secondary);}
  .CodeMirror-selected{background:rgba(245,158,11,.18) !important;}
  .cm-tag{color:#7DD3FC;}                 /* HTML tag names (structural — works for any tag name, Amharic included) */
  .cm-attribute{color:#FCA5A5;}           /* HTML attribute names */
  .cm-string{color:#86EFAC;}              /* strings, in any of the three languages */
  .cm-number{color:#FCD34D;}
  .cm-comment{color:var(--muted); font-style:italic;}
  .cm-property{color:#7DD3FC;}            /* CSS property names — structural, works for Amharic property names too */
  .cm-atom{color:#FCD34D;}
  .cm-direnya-keyword{color:#F59E0B; font-weight:600;}   /* ካሆነ/ጨርስ/ወይም/ድገም/ተግባር/... */
  .cm-direnya-builtin{color:#C4B5FD; font-weight:600;}   /* ጻፍ/አሳውቅ/አትም */
  .preview-pane{flex:1; display:flex; flex-direction:column; min-width:280px;}
  .preview-head{background:var(--panel); border-bottom:1px solid var(--border); padding:8px 14px; font-size:.78rem; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
  iframe{flex:1; border:none; background:#fff;}
  .warnings{background:var(--warn-bg); border-top:1px solid var(--border); max-height:120px; overflow-y:auto; padding:8px 14px; font-size:.78rem; color:var(--error); font-family:'Fira Code',monospace; display:none;}
  .warnings.show{display:block;}
  footer{background:var(--panel); border-top:1px solid var(--border); padding:8px 16px; font-size:.72rem; color:var(--muted); text-align:center;}
  .toast{position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--success); color:#fff; padding:10px 18px; border-radius:999px; font-size:.82rem; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--error);}
  #autosave-dot{opacity:0; transition:opacity .3s ease; font-size:.9rem; margin-right:4px;}
  #autosave-dot.show{opacity:.55;}
  @media(max-width:760px){
    main{flex-direction:column;}
    .editor-pane{width:100%; border-right:none; border-bottom:1px solid var(--border); height:50%;}
    .preview-pane{height:50%;}
    header{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:8px; padding:8px 10px;}
    header::-webkit-scrollbar{height:4px;}
    header h1{flex-shrink:0; font-size:.85rem;}
    header h1 .mark{width:22px; height:22px; font-size:.7rem;}
    header .spacer{display:none;}
    header button, header #autosave-dot{flex-shrink:0;}
    header button{padding:7px 10px; font-size:.8rem; white-space:nowrap;}
  }
</style>
</head>
<body>

<header>
  <h1><span class="mark">ድ</span> ድርኛ</h1>
  <span class="spacer"></span>
  <span id="autosave-dot" title="በራስ-ሰር ተቀምጧል (auto-saved)">💾</span>
  <button class="btn-theme" id="theme-toggle" onclick="toggleTheme()" title="ገጽታ ቀይር (Toggle light/dark)">🌙</button>
  <button class="btn-run" onclick="runProgram()">▶ አሳይ</button>
  <input type="file" id="photo-upload" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
  <button class="btn-dl" onclick="document.getElementById('photo-upload').click()">📷 ፎቶ (Photo)</button>
  <input type="file" id="video-upload" accept="video/*" style="display:none" onchange="handleVideoUpload(event)">
  <button class="btn-dl" onclick="document.getElementById('video-upload').click()">📹 ቪዲዮ(Video)</button>
  <input type="file" id="file-open" accept=".ወብ,.txt" style="display:none" onchange="openWebFile(event)">
  <button class="btn-dl" onclick="document.getElementById('file-open').click()">📂 ፕሮጀክት ክፈት (Open)</button>
  <button class="btn-dl" onclick="saveWebFile()">💾  አስቀምጥ (Save)</button>
  <button class="btn-dl" onclick="downloadPage()">⬇ ይህ ገጽ (This Page)</button>
  <button class="btn-run" style="background:var(--primary)" onclick="downloadForHosting()">📦 ለሆስቲንግ</button>
  <button class="btn-dl" onclick="if(confirm('የአሁኑን ኮድ አጥፍቶ ከባዶ መጀመር ይፈልጋሉ? This clears the saved code and starts over — it cannot be undone.')) clearAutosaveAndReset()">🗑 ከባዶ(Reset)</button>
</header>

<main>
  <div class="editor-pane">
    <div class="page-bar" id="page-bar">
      
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="html" id="tab-html-label">ገጽ <span style="opacity:.6">(HTML)</span></div>
      <div class="tab" data-tab="css">ዘይቤ <span style="opacity:.6">(shared)</span></div>
      <div class="tab" data-tab="js">ትእዛዝ <span style="opacity:.6">(shared)</span></div>
    </div>
    <div class="tab-content active" data-tab="html"><textarea id="src-html" spellcheck="false"></textarea></div>
    <div class="tab-content" data-tab="css"><textarea id="src-css" spellcheck="false"></textarea></div>
    <div class="tab-content" data-tab="js"><textarea id="src-js" spellcheck="false"></textarea></div>
  </div>

  <div class="preview-pane">
    <div class="preview-head"><span>ውጤት (Preview) — <span id="preview-page-label">ገጽ</span></span><span style="display:flex;align-items:center;gap:8px;"><span class="page-add-btn" id="preview-reset-btn" style="display:none;" onclick="resetPreviewToEditor()">↺ ወደ አርታኢው ገጽ</span><span id="status">●</span></span></div>
    <iframe id="preview" sandbox="allow-scripts allow-modals"></iframe>
    <div class="warnings" id="warnings"></div>
  </div>
</main>

<footer>ድርኛ (Direnya) — በአማርኛ ድረ-ገጽ የመሥሪያ መሣሪያ · Simplexer Project</footer>
<div class="toast" id="toast"></div>

<!-- ===== CodeMirror (syntax highlighting) — loaded from CDN; the playground degrades
     gracefully to plain textareas if this is unavailable (e.g. no internet), see initEditors() ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/overlay.min.js"></script>

<!-- ===== Transpiler engine (same files as lib/, inlined for zero-setup use) ===== -->
<script src="dictionaries.js"></script>
<script src="html-transpiler.js"></script>
<script src="css-transpiler.js"></script>
<script src="js-transpiler.js"></script>
<script src="web-format.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`.tab-content[data-tab="${tab.dataset.tab}"]`).classList.add('active');
  });
});

/* ---------- editor abstraction: CodeMirror if it loaded, plain textarea otherwise ---------- */
// This is the ONLY place the rest of the app should read/write editor content —
// every other function uses getSrc/setSrc, never element.value directly, so the
// whole app works identically whether CodeMirror loaded (has internet) or not.
const cmInstances = {}; // { html: CodeMirror|null, css: ..., js: ... }

const assetStore = new Map();

// Avoids silently overwriting a previous "foto.jpg" with a new upload —
// each upload gets a name guaranteed not to collide with what's already
// in the store, so old <ምስል> tags in the HTML keep pointing at the
// right file even after adding more photos.
function uniqueAssetName(originalName){
  const safe = (originalName || 'foto.jpg').replace(/[^\w.\-\u1200-\u137F]/g, '_');
  if(!assetStore.has(safe)) return safe;
  const dot = safe.lastIndexOf('.');
  const base = dot === -1 ? safe : safe.slice(0, dot);
  const ext  = dot === -1 ? ''   : safe.slice(dot);
  let n = 2;
  while(assetStore.has(`${base}-${n}${ext}`)) n++;
  return `${base}-${n}${ext}`;
}

// Wraps FileReader in a Promise so it can be awaited alongside the
// rest of the (currently synchronous) build pipeline.
function fileToDataUri(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}


/* ---------- pages (multi-page projects) ---------- */
// The editor only has ONE "html" slot — `pages` holds every page's markup,
// and `currentPageName` says which one is currently loaded into that slot.
// ዘይቤ.ድር/ትእዛዝ.ድር (css/js) stay global — shared across every page, same
// convention as the CLI's ገጾች/ folder (see lib/build.js).
const HOME_PAGE = 'ገጽ';
let pages = { [HOME_PAGE]: '' };
let currentPageName = HOME_PAGE;

function isReservedPageName(name){
  return ['style','script','runtime','index'].includes(name.toLowerCase());
}

function renderPageBar(){
  const bar = document.getElementById('page-bar');
  if(!bar) return;
  bar.innerHTML = '';
  Object.keys(pages).forEach(name=>{
    const pill = document.createElement('div');
    pill.className = 'page-pill' + (name === currentPageName ? ' active' : '');
    const label = document.createElement('span');
    label.textContent = name === HOME_PAGE ? `${name} (Home)` : name;
    pill.appendChild(label);
    pill.addEventListener('click', ()=> switchToPage(name));
    if(name !== HOME_PAGE){
      const del = document.createElement('span');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.title = 'ገጽ አጥፋ (delete page)';
      del.addEventListener('click', (e)=>{ e.stopPropagation(); deletePage(name); });
      pill.appendChild(del);
    }
    bar.appendChild(pill);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'page-add-btn';
  addBtn.textContent = '+ አዲስ ገጽ';
  addBtn.title = 'አዲስ ገጽ ጨምር (add a new page, e.g. contact)';
  addBtn.addEventListener('click', addNewPage);
  bar.appendChild(addBtn);

  const tabLabel = document.getElementById('tab-html-label');
  if(tabLabel) tabLabel.innerHTML = `${currentPageName}.ድር <span style="opacity:.6">(HTML)</span>`;
}

function switchToPage(name){
  if(name === currentPageName) return;
  pages[currentPageName] = getSrc('html');
  currentPageName = name;
  setSrc('html', pages[currentPageName] || '');
  switchToTab('html');
  renderPageBar();
  runProgram();
  scheduleAutosave();
}

function addNewPage(){
  const raw = prompt('የገጹ ስም (page name, e.g. ግንኙነት for contact) — no spaces or dots:');
  if(raw === null) return;
  const name = raw.trim();
  if(!name){ showToast('✗ ስም ያስፈልጋል (name required)', true); return; }
  if(/[\s./\\]/.test(name)){ showToast('✗ ክፍተት ወይም ነጥብ ያለ ስም ተጠቀም (no spaces or dots)', true); return; }
  if(pages[name] || isReservedPageName(name)){ showToast('✗ ይህ ስም ተይዟል (name already used)', true); return; }

  pages[currentPageName] = getSrc('html');
  pages[name] = `<ሰነድ>\n  <ራስ><አርእስት>${name}</አርእስት></ራስ>\n  <ሰውነት>\n    <ርዕስ1>${name}</ርዕስ1>\n  </ሰውነት>\n</ሰነድ>`;
  currentPageName = name;
  setSrc('html', pages[name]);
  switchToTab('html');
  renderPageBar();
  runProgram();
  scheduleAutosave();
  showToast(`✓ "${name}" ገጽ ተጨምሯል`);
}

function deletePage(name){
  if(name === HOME_PAGE) return;
  if(!confirm(`"${name}" ገጽ ይጥፋ? This deletes the page — it cannot be undone.`)) return;
  delete pages[name];
  if(currentPageName === name){
    currentPageName = HOME_PAGE;
    setSrc('html', pages[HOME_PAGE] || '');
  }
  renderPageBar();
  runProgram();
  scheduleAutosave();
  showToast(`✓ "${name}" ገጽ ጠፍቷል`);
}

/* ---------- whole-project save/open (.ወብ, now multi-page aware) ---------- */
// Extends the original single-page #ገጽ/#ዘይቤ/#ትእዛዝ format with an
// OPTIONAL page name on the ገጽ marker: "#ገጽ:ግንኙነት" starts a named
// extra page. A bare "#ገጽ" (no name) always means the home page —
// so every .ወብ file saved by the old single-page version of this
// tool still opens correctly, with its one page becoming home.
const PAGE_SECTION_RE = /^#ገጽ(?::(\S+))?\s*$/;
const SHARED_SECTION_RE = /^#(ዘይቤ|ትእዛዝ)\s*$/;

function serializeProject(){
  pages[currentPageName] = getSrc('html');
  const parts = [];
  Object.keys(pages).forEach(name=>{
    const body = (pages[name] || '').trim();
    if(!body) return;
    parts.push((name === HOME_PAGE ? '#ገጽ' : `#ገጽ:${name}`) + '\n' + body);
  });
  const css = getSrc('css').trim();
  const js  = getSrc('js').trim();
  if(css) parts.push('#ዘይቤ\n' + css);
  if(js)  parts.push('#ትእዛዝ\n' + js);
  return parts.join('\n\n') + '\n';
}

function parseProjectFile(source){
  const lines = source.split('\n');
  const parsedPages = {};
  const cssParts = [], jsParts = [];
  let current = { type: 'page', name: HOME_PAGE };
  let buffer = [];
  let sawAnyMarker = false;

  function flush(){
    const text = buffer.join('\n').trim();
    if(current.type === 'page'){
      if(text) parsedPages[current.name] = text;
    } else if(current.type === 'css' && text){
      cssParts.push(text);
    } else if(current.type === 'js' && text){
      jsParts.push(text);
    }
    buffer = [];
  }

  for(const line of lines){
    const trimmed = line.trim();
    const pm = PAGE_SECTION_RE.exec(trimmed);
    const sm = SHARED_SECTION_RE.exec(trimmed);
    if(pm){ flush(); current = { type: 'page', name: pm[1] || HOME_PAGE }; sawAnyMarker = true; continue; }
    if(sm){ flush(); current = { type: sm[1] === 'ዘይቤ' ? 'css' : 'js' }; sawAnyMarker = true; continue; }
    buffer.push(line);
  }
  flush();

  if(!sawAnyMarker){
    // no markers anywhere -> the whole file is plain HTML, same rule
    // as the original single-page format (simplest possible first file).
    parsedPages[HOME_PAGE] = source.trim();
  }
  if(!parsedPages[HOME_PAGE]) parsedPages[HOME_PAGE] = '';

  return { pages: parsedPages, css: cssParts.join('\n\n'), js: jsParts.join('\n\n'), hadExplicitSections: sawAnyMarker };
}

function getSrc(tab){
  const cm = cmInstances[tab];
  return cm ? cm.getValue() : document.getElementById('src-'+tab).value;
}
function setSrc(tab, value){
  const cm = cmInstances[tab];
  if(cm) cm.setValue(value);
  else document.getElementById('src-'+tab).value = value;
}

/* ---------- photo upload: file -> data URI -> inserted <ምስል> tag ---------- */
// The live preview runs inside a sandboxed iframe with NO filesystem access,
// so a path like "foto.jpg" can never load there — this sidesteps that by
// embedding the actual photo bytes directly into the code as a data: URI,
// which needs no external file or network request at all.
const PHOTO_SIZE_WARN_BYTES = 500 * 1024; // 500KB — big enough to slow the editor down

function switchToTab(tabName){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
  const tabEl = document.querySelector(`.tab[data-tab="${tabName}"]`);
  const contentEl = document.querySelector(`.tab-content[data-tab="${tabName}"]`);
  if(tabEl) tabEl.classList.add('active');
  if(contentEl) contentEl.classList.add('active');
  const cm = cmInstances[tabName];
  if(cm) setTimeout(()=>cm.refresh(), 0);
}

function insertAtCursor(tab, text){
  const cm = cmInstances[tab];
  const editorHasFocus = cm ? cm.hasFocus() : (document.activeElement === document.getElementById('src-'+tab));

  if(editorHasFocus){
    // person had actually clicked into the editor first — respect their cursor position
    if(cm){ cm.replaceSelection(text); cm.focus(); }
    else {
      const ta = document.getElementById('src-'+tab);
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + text.length;
      ta.dispatchEvent(new Event('input'));
      ta.focus();
    }
    return;
  }

  // no prior focus (e.g. clicked "Add Photo" without clicking into the code first) —
  // insert right before the closing body tag instead of blindly appending at the
  // very end, which would land outside </ሰነድ> and produce invalid HTML.
  const current = getSrc(tab);
  const closers = ['</አካል>', '</ሰውነት>'];
  let insertPos = -1, closer = null;
  for(const c of closers){
    const idx = current.lastIndexOf(c);
    if(idx !== -1){ insertPos = idx; closer = c; break; }
  }
  const updated = insertPos === -1
    ? current + text
    : current.slice(0, insertPos) + text + current.slice(insertPos);
  setSrc(tab, updated);
}

function handlePhotoUpload(event){
  const file = event.target.files[0];
  event.target.value = ''; // allow choosing the same file again later
  if(!file) return;
  if(!file.type.startsWith('image/')){
    showToast('✗ ይሄ የፎቶ ፋይል አይደለም (not an image file)', true);
    return;
  }

  const filename = uniqueAssetName(file.name);
  assetStore.set(filename, file);

  // The HTML source now gets a plain, short, portable filename —
  // exactly what a learner would write by hand for a real hosted page.
  const tag = `<ምስል ምንጭ="${filename}" መግለጫ="የእኔ ፎቶ">\n`;
  switchToTab('html');
  insertAtCursor('html', tag);
  runProgram(); // now async — see section 3; fire-and-forget is fine here
  showToast('✓ ፎቶ ተጨምሯል! (photo added)');
}

// Videos share the exact same asset pipeline as photos (assetStore,
// resolvePreviewAssets, downloadForHosting's zip.file loop are all
// already generic over any File — no changes needed there). The one
// real difference: video files are much bigger, and the LIVE PREVIEW
// has to inline them as base64 data URIs (the sandboxed preview iframe
// has no allow-same-origin, so blob: URLs from the parent page can't
// be loaded inside it — tested; only data URIs work). A big video as
// base64 can noticeably slow down or freeze the preview tab, so warn
// past a size threshold rather than silently letting it happen. The
// downloaded ZIP is unaffected either way — that copies the real file
// bytes, never base64.
const VIDEO_PREVIEW_WARN_MB = 8;

function handleVideoUpload(event){
  const file = event.target.files[0];
  event.target.value = '';
  if(!file) return;
  if(!file.type.startsWith('video/')){
    showToast('✗ ይሄ የቪዲዮ ፋይል አይደለም (not a video file)', true);
    return;
  }

  const filename = uniqueAssetName(file.name);
  assetStore.set(filename, file);

  const tag = `<ቪዲዮ ምንጭ="${filename}" ቁጥጥሮች>\n  ብራውዘርዎ ቪዲዮ አይደግፍም።\n</ቪዲዮ>\n`;
  switchToTab('html');
  insertAtCursor('html', tag);
  runProgram();

  const mb = file.size / (1024 * 1024);
  if(mb > VIDEO_PREVIEW_WARN_MB){
    showToast(`⚠ ቪዲዮ ተጨምሯል፣ ግን ${mb.toFixed(1)}MB ትልቅ ስለሆነ ቅድመ-እይታው ሊዘገይ ይችላል (ZIP ግን ትክክል ይሆናል)`, true);
  } else {
    showToast('✓ ቪዲዮ ተጨምሯል! (video added)');
  }
}


/* ---------- custom syntax highlighting for the Amharic JS mini-DSL ---------- */
// An "overlay" mode: real JS highlighting (strings/numbers/comments/etc, via
// CodeMirror's built-in javascript mode) underneath, with our block-structure
// keywords and built-in function names painted on top. Word-boundary check
// mirrors the one in lib/js-transpiler.js's translateLiterals — Ethiopic
// letters aren't in \w, so \b doesn't work; check neighboring characters by hand.
function defineDirenyaJSMode(){
  if(typeof CodeMirror === 'undefined' || typeof CodeMirror.overlayMode !== 'function') return;

  const KEYWORDS = ['ካሆነ','ካልሆነ','ወይም','ድገም','ጊዜ','እያንዳንዱ','በ','ተግባር','ጨርስ','መልስ','እውነት','ሐሰት',
                     'kahone','kalhone','weyim','digem','gize','eyandandu','be','tegbar','chers','mels','ewnet','hasete'];
  const BUILTINS = ['ጻፍ','አሳውቅ','አትም','ንጥል_በመለያ','ንጥሎች_በመደብ','ጽሑፍ_አስቀምጥ','ጽሑፍ_አግኝ',
                     'ስልት_አስቀምጥ','መደብ_ጨምር','መደብ_አስወግድ','መደብ_ቀያይር','ዋጋ_አግኝ','ዋጋ_አስቀምጥ','ስማ',
                     'tsaf','asawek','atim','nitil_bemeleya','nitiloch_bemedeb','tsihuf_askemt','tsihuf_agn',
                     'silt_askemt','medeb_chemr','medeb_aswegd','medeb_keyayir','waga_agn','waga_askemt','sima'];
  const ETHIOPIC = /[\u1200-\u137F]/;
  const IDENT_CHAR = /[A-Za-z0-9_$\u1200-\u137F]/; // must match the identifier charset used in lib/js-transpiler.js's assignLine regex

  function isBoundary(str, pos){
    if(pos < 0 || pos >= str.length) return true;
    return !IDENT_CHAR.test(str[pos]);
  }
  function matchWordList(stream, words, className){
    const rest = stream.string.slice(stream.pos);
    for(const w of words){
      if(rest.startsWith(w) && isBoundary(stream.string, stream.pos - 1) && isBoundary(stream.string, stream.pos + w.length)){
        stream.pos += w.length;
        return className;
      }
    }
    return null;
  }

  CodeMirror.defineMode('direnya-js', function(config){
    const overlay = {
      token: function(stream){
        let m;
        if((m = matchWordList(stream, KEYWORDS, 'direnya-keyword'))) return m;
        if((m = matchWordList(stream, BUILTINS, 'direnya-builtin'))) return m;
        stream.next();
        return null;
      }
    };
    return CodeMirror.overlayMode(CodeMirror.getMode(config, 'javascript'), overlay);
  });
}

function initEditors(){
  if(typeof CodeMirror === 'undefined'){
    console.warn('CodeMirror did not load (offline?) — falling back to plain textareas.');
    return;
  }
  defineDirenyaJSMode();
  const common = { lineNumbers:true, lineWrapping:true, viewportMargin:Infinity, tabSize:2, indentUnit:2 };
  cmInstances.html = CodeMirror.fromTextArea(document.getElementById('src-html'), { ...common, mode:'xml', htmlMode:true });
  cmInstances.css  = CodeMirror.fromTextArea(document.getElementById('src-css'),  { ...common, mode:'css' });
  cmInstances.js   = CodeMirror.fromTextArea(document.getElementById('src-js'),   { ...common, mode:'direnya-js' });
  // Redraw the newly-active editor when switching tabs — CodeMirror measures
  // itself on init and gets confused if that happens while display:none.
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const cm = cmInstances[tab.dataset.tab];
      if(cm) setTimeout(()=>cm.refresh(), 0);
    });
  });
}

/* ---------- autosave (localStorage, per-browser, no server) ---------- */
// Saves html/css/js to localStorage on every edit (debounced), and restores
// on the next visit instead of the starter example — so closing the tab or
// refreshing never loses work. Storage is per-browser/per-device only (not
// synced across devices), and is cleared if the person clears site data.
const AUTOSAVE_KEY = 'direnya-playground-autosave-v1';
const THEME_KEY = 'direnya-playground-theme';
let autosaveTimer = null;
let autosaveDotTimer = null;

function applyStoredTheme(){
  let saved;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(err){ saved = null; }
  if(saved === 'light'){
    document.body.classList.add('light-mode');
    const btn = document.getElementById('theme-toggle');
    if(btn) btn.textContent = '☀️';
  }
}
function toggleTheme(){
  const isLight = document.body.classList.toggle('light-mode');
  const btn = document.getElementById('theme-toggle');
  if(btn) btn.textContent = isLight ? '☀️' : '🌙';
  try{ localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark'); }catch(err){}
}

function autosaveNow(){
  try{
    pages[currentPageName] = getSrc('html');
    const payload = { pages, currentPageName, css: getSrc('css'), js: getSrc('js'), savedAt: Date.now() };
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
    const dot = document.getElementById('autosave-dot');
    if(dot){ dot.classList.add('show'); clearTimeout(autosaveDotTimer); autosaveDotTimer = setTimeout(()=>dot.classList.remove('show'), 900); }
  }catch(err){
    // localStorage can throw if full or disabled (private browsing) — autosave
    // is a convenience, not a requirement, so fail silently rather than
    // interrupting the person's work with an error they can't act on.
    console.warn('Autosave failed (localStorage unavailable):', err);
  }
}
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosaveNow, 600);
}
function tryRestoreAutosave(){
  let raw;
  try{ raw = localStorage.getItem(AUTOSAVE_KEY); }catch(err){ return false; }
  if(!raw) return false;
  try{
    const data = JSON.parse(raw);
    if(data.pages){
      // current format: multiple pages
      pages = data.pages;
      currentPageName = data.currentPageName && pages[data.currentPageName] !== undefined ? data.currentPageName : HOME_PAGE;
    } else {
      // old single-page autosave format — migrate into pages[HOME_PAGE]
      pages = { [HOME_PAGE]: data.html || '' };
      currentPageName = HOME_PAGE;
    }
    setSrc('html', pages[currentPageName] || '');
    setSrc('css', data.css || '');
    setSrc('js', data.js || '');
    renderPageBar();
    return true;
  }catch(err){
    console.warn('Autosave data was corrupted, ignoring it:', err);
    return false;
  }
}
function clearAutosaveAndReset(){
  try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(err){}
  loadStarterExample();
  runProgram();
  showToast('✓ ከባዶ ተጀምሯል');
}
function wireAutosaveListeners(){
  ['html','css','js'].forEach(tab=>{
    const cm = cmInstances[tab];
    if(cm) cm.on('change', scheduleAutosave);
    else document.getElementById('src-'+tab).addEventListener('input', scheduleAutosave);
  });
  window.addEventListener('beforeunload', autosaveNow);
}

/* ---------- browser APIs beyond the DOM ----------
   fetch/timers/storage/random — the other things a real page commonly
   needs. Same rule as everywhere else: only the FUNCTION NAME gets an
   Amharic wrapper; whatever you pass in (URLs, keys, values, numbers)
   is data and stays exactly as you write it. */

function አምጣ(አድራሻ, ምርጫዎች) {
  // "fetch/bring" — wraps fetch(url) so ትእዛዝ.ድር code gets a ready-
  // parsed JSON object back instead of two separate .then() steps.
  // Still a normal Promise — use with መልስ/return inside an async
  // function, or with .then(...) directly; both "async"/"await" and
  // ".then" already work as-is, since they're real JS keywords/methods,
  // never translated.
  return fetch(አድራሻ, ምርጫዎች).then(function (ምላሽ) {
    if (!ምላሽ.ok) throw new Error('HTTP ' + ምላሽ.status);
    return ምላሽ.json();
  });
}

function ጠብቅ(ተግባር, ሚሊሰከንድ) {
  // "wait" — setTimeout(fn, ms). Returns the timer id (rarely needed,
  // but matches what setTimeout itself returns, in case a lesson wants
  // to clearTimeout it later).
  return setTimeout(ተግባር, ሚሊሰከንድ);
}

function ቋሚ_አስቀምጥ(ስም, ዋጋ) {
  // "save permanently" — localStorage.setItem. Objects/arrays need
  // ወደ_ጽሁፍ (JSON.stringify) first if you want to store more than
  // a plain string/number. Wrapped in try/catch because a SANDBOXED
  // preview (no real origin) blocks localStorage entirely — on a real
  // deployed page this always works normally; only inside a sandboxed
  // preview does it quietly warn instead of crashing the whole script.
  try { localStorage.setItem(ስም, ዋጋ); }
  catch (ስሕተት) { console.warn('ቋሚ_አስቀምጥ: localStorage not available here —', ስሕተት.message); }
}
function ቋሚ_አግኝ(ስም) {
  // "get permanent" — localStorage.getItem. Returns null if nothing
  // was ever saved under that name, OR if localStorage isn't reachable
  // (see ቋሚ_አስቀምጥ's comment) — same fallback as a normal missing key.
  try { return localStorage.getItem(ስም); }
  catch (ስሕተት) { console.warn('ቋሚ_አግኝ: localStorage not available here —', ስሕተት.message); return null; }
}
function ቋሚ_አጥፋ(ስም) {
  // "erase permanent" — localStorage.removeItem.
  try { localStorage.removeItem(ስም); }
  catch (ስሕተት) { console.warn('ቋሚ_አጥፋ: localStorage not available here —', ስሕተት.message); }
}

function ዘፈቀደ() {
  // "random" — Math.random(), a decimal from 0 up to (not including) 1.
  return Math.random();
}
function ዘፈቀደ_ቁጥር(ከ, እስከ) {
  // "random number" — a whole number from ከ (from) up to and including
  // እስከ (to). E.g. ዘፈቀደ_ቁጥር(1, 6) for a dice roll.
  return Math.floor(Math.random() * (እስከ - ከ + 1)) + ከ;
}

function ወደ_ጽሁፍ(እቃ) {
  // "to text" — JSON.stringify. Needed before ቋሚ_አስቀምጥ if ዋጋ is an
  // array/object rather than a plain string or number.
  return JSON.stringify(እቃ);
}
function ወደ_እቃ(ጽሁፍ) {
  // "to object" — JSON.parse. The inverse of ወደ_ጽሁፍ — turns text
  // (e.g. from ቋሚ_አግኝ or አምጣ's raw text) back into a real value.
  return JSON.parse(ጽሁፍ);
}

   that table is the documentation/source of truth for which aliases

// Same fix as lib/build.js: handles pages with no explicit ራስ (head)
// section without producing a dangling, unmatched closing tag.
function injectIntoHead(html, block){
  if(/<\/head>/i.test(html)) return html.replace(/<\/head>/i, block+'\n</head>');
  if(/<html[^>]*>/i.test(html)) return html.replace(/(<html[^>]*>)/i, `$1\n<head>\n${block}\n</head>`);
  return block + '\n' + html;
}
function injectBeforeBodyClose(html, block){
  if(/<\/body>/i.test(html)) return html.replace(/<\/body>/i, block+'\n</body>');
  if(/<\/html>/i.test(html)) return html.replace(/<\/html>/i, block+'\n</html>');
  return html + '\n' + block;
}

function buildNavInterceptScript(){
  // Maps every href a page-link could plausibly use to that page's name,
  // so the sandboxed preview iframe can recognize "this points at one of
  // our pages" and ask the parent to swap the preview instead of trying
  // (and failing) to navigate somewhere that doesn't exist in the sandbox.
  const map = {};
  Object.keys(pages).forEach(name=>{
    if(name === HOME_PAGE){
      map['index.html'] = name; map[''] = name; map['#'] = name; map['./'] = name; map['./index.html'] = name;
    } else {
      map[`${name}.html`] = name; map[`./${name}.html`] = name;
    }
  });
  return `<script>(function(){
    var PAGES = ${JSON.stringify(map)};
    document.addEventListener('click', function(e){
      var a = e.target.closest && e.target.closest('a[href]');
      if(!a) return;
      var href = a.getAttribute('href');
      if(Object.prototype.hasOwnProperty.call(PAGES, href)){
        e.preventDefault();
        parent.postMessage({ type: 'direnya-navigate', page: PAGES[href] }, '*');
      }
    }, true);
  })();<\/script>`;
}

function buildFullHtmlForPage(name){
  // Whichever page is currently open in the editor should reflect
  // live, unsaved edits; every other page renders from its last-saved
  // source in `pages`.
  const htmlSrc = name === currentPageName ? getSrc('html') : (pages[name] || '');
  const cssSrc  = getSrc('css');
  const jsSrc   = getSrc('js');

  const warnings = [];
  const { html, warnings: hw } = transpileHTML(htmlSrc);
  warnings.push(...hw.map(w=>`[${name}.ድር] `+w));
  const { css, warnings: cw } = transpileCSS(cssSrc);
  warnings.push(...cw.map(w=>'[ዘይቤ.ድር] '+w));
  const { js, warnings: jw } = transpileJS(jsSrc);
  warnings.push(...jw.map(w=>'[ትእዛዝ.ድር] '+w));

  let out = injectIntoHead(html, `<style>${css}</style>`);
  out = injectBeforeBodyClose(out, `<script>${RUNTIME_JS}\n${js}<\/script>`);
  out = injectBeforeBodyClose(out, buildNavInterceptScript());
  if(!/<!doctype/i.test(out)) out = '<!DOCTYPE html>\n'+out;

  return { fullHtml: out, warnings };
}

function buildFullHtml(){
  return buildFullHtmlForPage(currentPageName);
}

async function resolvePreviewAssets(html){
  if(assetStore.size === 0) return html;
  let out = html;
  for(const [filename, file] of assetStore){
    const pattern = new RegExp(
      `(src=["'])${filename.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(["'])`,
      'g'
    );
    if(pattern.test(out)){
      const dataUri = await fileToDataUri(file);
      out = out.replace(pattern, `$1${dataUri}$2`);
    }
  }
  return out;
}

let previewedPageName = HOME_PAGE;

async function showPreviewForPage(name){
  previewedPageName = name;
  const { fullHtml, warnings } = buildFullHtmlForPage(name);
  const previewHtml = await resolvePreviewAssets(fullHtml);
  document.getElementById('preview').srcdoc = previewHtml;

  const label = document.getElementById('preview-page-label');
  if(label) label.textContent = name;
  const resetBtn = document.getElementById('preview-reset-btn');
  if(resetBtn) resetBtn.style.display = (name !== currentPageName) ? '' : 'none';

  const wBox = document.getElementById('warnings');
  if(warnings.length){
    wBox.innerHTML = warnings.map(w=>'⚠ '+w).join('<br>');
    wBox.classList.add('show');
    document.getElementById('status').style.color = 'var(--secondary)';
  } else {
    wBox.classList.remove('show');
    document.getElementById('status').style.color = 'var(--success)';
  }
}

function resetPreviewToEditor(){
  showPreviewForPage(currentPageName);
}

window.addEventListener('message', (event)=>{
  const data = event.data;
  if(!data || data.type !== 'direnya-navigate') return;
  if(!Object.prototype.hasOwnProperty.call(pages, data.page)) return;
  showPreviewForPage(data.page); // simulated navigation — doesn't touch the editor's currentPageName
});

async function runProgram(){
  pages[currentPageName] = getSrc('html');
  await showPreviewForPage(currentPageName);
}

async function downloadPage(){
  const { fullHtml } = buildFullHtmlForPage(currentPageName);
  const finalHtml = await resolvePreviewAssets(fullHtml);
  const blob = new Blob([finalHtml], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentPageName === HOME_PAGE ? 'የእኔ-ገጽ.html' : `${currentPageName}.html`;
  a.click();
  showToast('✓ አንድ HTML ፋይል ወረደ');
}

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(msg, isError){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ---------- .ወብ open / save (single real file, three sections) ---------- */
function saveWebFile(){
  const source = serializeProject();
  const blob = new Blob([source], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'የእኔ-ፕሮጀክት.ወብ';
  a.click();
  const n = Object.keys(pages).length;
  showToast(`✓ ፕሮጀክት ተቀምጧል (${n} ገጽ${n > 1 ? 'ች' : ''})`);
}

function openWebFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const { pages: newPages, css, js, hadExplicitSections } = parseProjectFile(reader.result);
      pages = newPages;
      if(!pages[HOME_PAGE]) pages[HOME_PAGE] = ''; // always guarantee a home page exists
      currentPageName = HOME_PAGE;
      setSrc('html', pages[HOME_PAGE] || '');
      setSrc('css', css);
      setSrc('js', js);
      renderPageBar();
      runProgram();
      const n = Object.keys(pages).length;
      showToast(hadExplicitSections
        ? `✓ "${file.name}" ተከፍቷል (${n} ገጽ${n > 1 ? 'ች' : ''})`
        : `✓ "${file.name}" እንደ ገጽ (HTML) ተከፍቷል`);
    }catch(err){
      showToast('✗ ፋይሉን መክፈት አልተቻለም', true);
      console.error(err);
    }
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = ''; // allow re-opening the same filename later
}

/* ---------- "ready to host" export: real separate index.html / style.css / script.js ---------- */
async function downloadForHosting(){
  pages[currentPageName] = getSrc('html'); // sync whatever's on-screen right now
  const cssSrc = getSrc('css');
  const jsSrc  = getSrc('js');

  const warnings = [];
  const { css, warnings: cw } = transpileCSS(cssSrc);
  warnings.push(...cw.map(w => '[ዘይቤ.ድር] ' + w));
  const { js, warnings: jw } = transpileJS(jsSrc);
  warnings.push(...jw.map(w => '[ትእዛዝ.ድር] ' + w));

  const linkTag   = css.trim() ? `<link rel="stylesheet" href="style.css">` : '';
  const scriptTags = js.trim() ? `<script src="runtime.js"><\/script>\n<script src="script.js"><\/script>` : '';

  const zip = new JSZip();
  const builtFiles = [];

  // Every page — home page (ገጽ) always becomes index.html; every other
  // page becomes <name>.html — all sharing the same style.css/script.js.
  for(const name of Object.keys(pages)){
    const { html, warnings: hw } = transpileHTML(pages[name] || '');
    warnings.push(...hw.map(w => `[${name}.ድር] ${w}`));

    let outHtml = html; // untouched — still has plain src="foto.jpg"
    if(linkTag) outHtml = injectIntoHead(outHtml, linkTag);
    if(scriptTags) outHtml = injectBeforeBodyClose(outHtml, scriptTags);
    if(!/<!doctype/i.test(outHtml)) outHtml = '<!DOCTYPE html>\n' + outHtml;

    const fileName = name === HOME_PAGE ? 'index.html' : `${name}.html`;
    zip.file(fileName, outHtml);
    builtFiles.push(fileName);
  }

  if(css.trim()){ zip.file('style.css', css); builtFiles.push('style.css'); }
  if(js.trim()){
    zip.file('script.js', js);
    zip.file('runtime.js', RUNTIME_JS.trim());
    builtFiles.push('script.js', 'runtime.js');
  }
  // The actual fix: real binary files, real filenames, no base64.
  for(const [filename, file] of assetStore){
    zip.file(filename, file);
    builtFiles.push(filename);
  }

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'የእኔ-ገጽ-ለሆስቲንግ.zip';
  a.click();

  showToast(warnings.length ? `⚠ ${warnings.length} ማስጠንቀቂያ(ዎች) ጋር ወረደ` : `✓ ZIP ተዘጋጅቷል — ${builtFiles.join(', ')}`);
}
// set up editors, then run once so the preview isn't blank
window.addEventListener('DOMContentLoaded', () => {
  applyStoredTheme();
  initEditors();
  const restored = tryRestoreAutosave();
  if(!restored) loadStarterExample();
  wireAutosaveListeners();
  runProgram();
  if(restored) showToast('✓ ካለፈው ክፍለ ጊዜ ተመልሷል (auto-saved)');
});
